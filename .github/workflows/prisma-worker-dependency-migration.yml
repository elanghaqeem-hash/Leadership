name: prisma-worker-dependency-migration

on:
  push:
    paths:
      - docs/prisma-worker-migration.trigger

permissions:
  contents: write

jobs:
  migrate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade Prisma for Cloudflare Workers
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = { ...(pkg.overrides || {}), 'deepmerge-ts': '^8.0.2' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --save-exact @prisma/client@6.19.3 @prisma/adapter-pg@6.19.3 pg@8.23.1
          npm install --save-dev --save-exact prisma@6.19.3
      - name: Commit generated package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update Prisma Worker adapter dependencies"
          git push origin HEAD:main
