name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leadership
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d leadership"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/leadership?schema=public
      APP_URL: http://127.0.0.1:3000
      APP_SECRET: ci-only-app-secret-at-least-32-bytes-long
      MFA_ENCRYPTION_KEY: ci-only-mfa-encryption-key-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply committed Prisma migrations
        run: npm run db:migrate

      - name: Verify migration state
        run: npx prisma migrate status

      - name: Seed Excel-derived master content
        run: npm run db:seed

      - name: Database seed smoke
        run: npm run test:sprint1:db

      - name: Apply and verify PostgreSQL RLS with non-owner runtime role
        run: npm run test:rls

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:sprint2

      - name: Production build
        run: npm run build

      - name: Create HTTP auth smoke user
        run: |
          node scripts/create-auth-smoke-user.mjs > /tmp/auth-smoke.out
          grep '^AUTH_' /tmp/auth-smoke.out >> "$GITHUB_ENV"
          grep '^::add-mask::' /tmp/auth-smoke.out || true

      - name: Start production server
        run: |
          npm --workspace @ltw/web run start > /tmp/leadership-next.log 2>&1 &
          echo $! > /tmp/leadership-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/leadership-next.log
          exit 1

      - name: HTTP login/session smoke
        run: npm run test:auth:http

      - name: Dependency audit gate
        run: npm audit --omit=dev --audit-level=high


      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/leadership-next.pid ]; then
            kill "$(cat /tmp/leadership-next.pid)" || true
          fi
